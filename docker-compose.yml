version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitmeister-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fitmeister_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: fitmeister-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/fitmeister_db?schema=public
      JWT_SECRET: production_jwt_secret_fitmeister_enterprise_grade_security_32chars
      SESSION_SECRET: production_session_secret_fitmeister_enterprise_security_32chars
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: fitmeister-frontend
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
